
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Inventory</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #172033;
        }

        .header {
            background: #111827;
            color: white;
            padding: 25px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 { margin: 0; font-size: 28px; }

        .header p {
            margin: 7px 0 0;
            color: #cbd5e1;
        }

        .container {
            max-width: 1250px;
            margin: auto;
            padding: 28px 20px;
        }

        .top-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 22px;
        }

        .btn {
            display: inline-block;
            border: none;
            border-radius: 8px;
            padding: 11px 16px;
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .add-btn { background: #2563eb; }
        .home-btn { background: #374151; }

        .search-box {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: white;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 3px 12px #00000008;
        }

        .search-box input {
            flex: 1;
            min-width: 150px;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
        }

        .search-btn { background: #111827; }
        .reset-btn { background: #64748b; }

        .car-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
        }

        .car-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #e5e7eb;
            box-shadow: 0 5px 18px #0000000b;
            transition: transform .2s;
        }

        .car-card:hover { transform: translateY(-4px); }

        .car-image {
            display: block;
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #e5e7eb;
        }

        .car-details { padding: 18px; }

        .car-details h2 {
            font-size: 21px;
            margin: 13px 0 6px;
        }

        .car-brand, .car-info {
            color: #64748b;
            font-size: 14px;
            margin: 9px 0;
        }

        .car-price {
            font-size: 24px;
            font-weight: bold;
            color: #2563eb;
            margin: 15px 0;
        }

        .car-status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            background: #e5e7eb;
            color: #374151;
        }

        .available {
            background: #dcfce7;
            color: #166534;
        }

        .sold {
            background: #fee2e2;
            color: #991b1b;
        }

        .car-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .car-actions a {
            flex: 1;
            text-align: center;
            text-decoration: none;
            color: white;
            padding: 10px;
            border-radius: 7px;
            font-size: 14px;
        }

        .edit-btn { background: #d97706; }
        .delete-btn { background: #dc2626; }

        .empty-state {
            background: white;
            border-radius: 12px;
            padding: 35px;
            text-align: center;
            color: #64748b;
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 23px; }
            .container { padding: 20px 14px; }
            .car-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

<header class="header">
    <div>
        <h1>Car Inventory</h1>
        <p>Manage your cars in one place</p>
    </div>
    <a th:href="@{/dashboard}" class="btn home-btn">Back to Home</a>
</header>

<main class="container">

    <div class="top-actions">
        <h2>Available Car Listings</h2>
        <a th:href="@{/cars/add}" class="btn add-btn">+ Add Car</a>
    </div>

    <!-- Search by name, brand or model -->
    <form th:action="@{/cars}" method="get" class="search-box">
        <input type="text" name="name" placeholder="Search car name">
        <input type="text" name="brand" placeholder="Search brand">
        <input type="text" name="model" placeholder="Search model">
        <button type="submit" class="btn search-btn">Search</button>
        <a th:href="@{/cars}" class="btn reset-btn">Reset</a>
    </form>

    <div class="car-grid" th:if="${cars != null and !cars.isEmpty()}">

        <article class="car-card" th:each="car : ${cars}">

            <img class="car-image"
                 th:src="${car.imageUrl != null and !#strings.isEmpty(car.imageUrl) ? car.imageUrl : 'https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&amp;fit=crop&amp;w=900&amp;q=80'}"
                 th:alt="${car.brand + ' ' + car.model}"
                 onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&amp;fit=crop&amp;w=900&amp;q=80';">

            <div class="car-details">

                <span class="car-status"
                      th:classappend="${car.status != null and car.status.equalsIgnoreCase('Available')} ? ' available' : ' sold'"
                      th:text="${car.status != null ? car.status : 'Status unknown'}">
                    Available
                </span>

                <h2 th:text="${car.name}">Car Name</h2>

                <p class="car-brand">
                    <span th:text="${car.brand}">Brand</span>
                    ·
                    <span th:text="${car.model}">Model</span>
                </p>

                <p class="car-info">
                    Year: <span th:text="${car.year}">2024</span>
                </p>

                <p class="car-price">
                    ₹<span th:text="${#numbers.formatDecimal(car.price, 1, 'COMMA', 0, 'POINT')}">650,000</span>
                </p>

                <p class="car-info">
                    Fuel: <span th:text="${car.fuelType}">Petrol</span>
                </p>

                <div class="car-actions">
                    <a class="edit-btn"
                       th:href="@{/cars/edit/{id}(id=${car.id})}">
                        Edit
                    </a>

                    <a class="delete-btn"
                       th:href="@{/cars/delete/{id}(id=${car.id})}"
                       onclick="return confirm('Are you sure you want to delete this car?');">
                        Delete
                    </a>
                </div>

            </div>
        </article>

    </div>

    <div class="empty-state"
         th:if="${cars == null or cars.isEmpty()}">
        <h3>No cars found</h3>
        <p>Try another search or add a new car to your inventory.</p>
    </div>

</main>

</body>
</html>


<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Car Inventory</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f3f6fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #152238;
        }

        .stat-card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark px-3 px-md-5 py-3">
    <span class="navbar-brand fw-bold">
        🚘 Car Inventory Admin
    </span>

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-outline-light">
            Logout
        </button>
    </form>
</nav>

<div class="container py-5">

    <div class="mb-4">
        <h2 class="fw-bold">Dashboard</h2>
        <p class="text-secondary">
            Welcome to your Car Inventory Management System.
        </p>
    </div>

    <div class="row g-4 mb-5">

        <div class="col-12 col-md-4">
            <div class="card stat-card p-4">
                <p class="text-secondary mb-2">Total Cars</p>
                <div class="stat-number"
                     th:text="${totalCars} ?: 0">0</div>
            </div>
        </div>

        <div class="col-12 col-md-4">
            <div class="card stat-card p-4">
                <p class="text-secondary mb-2">Available Cars</p>
                <div class="stat-number text-success"
                     th:text="${availableCars} ?: 0">0</div>
            </div>
        </div>

        <div class="col-12 col-md-4">
            <div class="card stat-card p-4">
                <p class="text-secondary mb-2">Sold Cars</p>
                <div class="stat-number text-danger"
                     th:text="${soldCars} ?: 0">0</div>
            </div>
        </div>

    </div>

    <div class="card stat-card p-4">
        <h4 class="fw-bold">Manage Inventory</h4>
        <p class="text-secondary">
            Add new cars, update existing records, or search your inventory.
        </p>

        <div>
            <a th:href="@{/cars}" class="btn btn-primary me-2 mb-2">
                View All Cars
            </a>

            <a th:href="@{/cars/add}"
               class="btn btn-success mb-2">
                + Add New Car
            </a>
        </div>
    </div>

</div>

</body>
</html>
